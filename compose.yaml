services:
  postgres:
    image: postgres:16-alpine
    container_name: studdy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-academic_organizer}
      POSTGRES_USER: ${DB_USERNAME:-academic_organizer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - studdy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-academic_organizer} -d ${DB_NAME:-academic_organizer}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  studdy_postgres_data:
