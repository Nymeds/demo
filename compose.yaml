services:
  postgres:
    image: postgres:16-alpine
    container_name: studdy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studdy}
      POSTGRES_USER: ${POSTGRES_USER:-studdy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studdy_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - studdy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studdy} -d ${POSTGRES_DB:-studdy}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  studdy_postgres_data:
