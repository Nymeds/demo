spring.application.name=demo

# Persistencia padrao: PostgreSQL. Defina DB_PASSWORD (sem valor padrao de proposito: sem ele a conexao falha claramente).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/academic_organizer}
spring.datasource.username=${DB_USERNAME:academic_organizer}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# Esquema: o Flyway (db/migration) roda ANTES do Hibernate e aplica as correcoes que o ddl-auto=update nao
# faz (restricoes, indices parciais, limpeza de dados). Bancos ja existentes sem historico do Flyway recebem
# baseline na versao 1 e depois V2+. Plano: quando houver um V1 com o esquema completo, usar DDL_AUTO=validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Pool de conexoes (Hikari) e tempos limite.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
# Abaixo do idle timeout tipico de proxies/PostgreSQL gerenciados (30 min).
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.leak-detection-threshold=30000
# Repassado ao driver pgjdbc (propriedade "options"): limites por sessao no PostgreSQL. O H2 ignora.
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=30000 -c lock_timeout=5000
spring.jpa.properties.jakarta.persistence.lock.timeout=5000
# Sem hibernate.jdbc.time_zone=UTC: as colunas de horario (timestamp/time sem fuso) guardam o horario
# local. Com UTC, os horarios ja salvos (aulas, eventos) apareceriam 3 horas antes e os novos seriam
# gravados em outro fuso, misturando o banco. Mudar isso exige migrar os dados.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Limpeza periodica de sessoes expiradas (cron do Spring: seg min hora dia mes dia-da-semana).
app.session.purge-cron=${SESSION_PURGE_CRON:0 30 3 * * *}
# O seed de demonstracao (perfis dev/seed) so roda contra banco local; nunca libere em producao.
app.seed.allow-remote=false

# JWT: sem valor padrao. JWT_SECRET e obrigatorio (minimo 32 bytes) fora do perfil dev.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration-ms=${JWT_EXPIRATION_MS:900000}

# Foto de perfil: o frontend envia a imagem já recortada, bem abaixo destes limites. A leitura
# preguiçosa faz o erro de arquivo grande chegar ao tratamento de erros do UserController (foto de perfil).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.resolve-lazily=true

# Versoes vigentes dos Termos de Uso e da Politica de Privacidade (aceite registrado no cadastro).
app.legal.terms-version=${LEGAL_TERMS_VERSION:2026-09-29}
app.legal.privacy-version=${LEGAL_PRIVACY_VERSION:2026-09-29}

# Sessao do navegador: cookie HttpOnly "acad-organize.session" (Lembrar de mim: 30 dias; sem ele: 12 h,
# cookie de sessao do navegador). Obrigatorio true em producao HTTPS, inclusive quando TLS termina no proxy.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# Recuperacao de senha: servico Nodemailer privado (pasta mailer/ na raiz do repositorio).
# Configure os segredos no ambiente (o npm run init le o .env da raiz), nunca no frontend.
app.recovery.mailer-url=${MAILER_URL:http://127.0.0.1:3001}
app.recovery.mailer-secret=${MAILER_API_SECRET:}
app.recovery.hash-secret=${RECOVERY_HASH_SECRET:${app.jwt.secret}}
# Inicializacao local do Nodemailer ao subir o servidor HTTP; desative para servico externo.
app.recovery.mailer-auto-start=${MAILER_AUTO_START:false}
# Relativo a pasta de onde o backend roda (backend/), por isso ../mailer.
app.recovery.mailer-directory=${MAILER_DIRECTORY:../mailer}
app.recovery.node-executable=${NODE_EXECUTABLE:node}

# Proxy reverso: com "none" o IP do cliente e o da conexao TCP (request.getRemoteAddr()). Atras de
# um proxy/load balancer confiavel, use FORWARD_HEADERS_STRATEGY=native e restrinja
# server.tomcat.remoteip.internal-proxies ao IP do proxy: o RemoteIpValve do Tomcat le o X-Forwarded-For
# da direita para a esquerda e so pula saltos confiaveis. Evite "framework": o ForwardedHeaderFilter
# confia no cabecalho de QUALQUER origem (usa o valor mais a esquerda, que o cliente controla).
# Nunca habilite sem proxy na frente: o cabecalho seria forjavel.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Limites contra abuso (memoria local; com varias instancias cada uma conta separado).
app.rate-limit.password-confirmation.max-failures=5
app.rate-limit.password-confirmation.window=15m
app.rate-limit.register.max-per-ip=10
app.rate-limit.register.window=1h
app.rate-limit.token.max-per-ip=60
app.rate-limit.token.window=1m
