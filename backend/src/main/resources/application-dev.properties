# Perfil de desenvolvimento local: H2 em memoria + usuario demo. NUNCA usar em producao.
spring.datasource.url=jdbc:h2:mem:academic-organizer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Segredo exclusivo de desenvolvimento; JWT_SECRET, se definido, tem prioridade.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-do-not-use-in-production}
# Confia no X-Forwarded-For do proxy do Vite (xfwd) para cada aparelho ter o próprio IP nos limites de login.
# Só em desenvolvimento: fora de um proxy confiável, o cliente poderia forjar esse cabeçalho.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
