spring.application.name=demo
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:h2:mem:academic-organizer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.jwt.secret=${JWT_SECRET:troque-esta-chave-local-por-uma-chave-com-mais-de-32-bytes}
app.jwt.access-token-expiration-ms=${JWT_EXPIRATION_MS:900000}
# Serviço Nodemailer privado. Configure os segredos no ambiente, nunca no frontend.
app.recovery.mailer-url=${MAILER_URL:http://127.0.0.1:3001}
app.recovery.mailer-secret=${MAILER_API_SECRET:}
app.recovery.hash-secret=${RECOVERY_HASH_SECRET:${app.jwt.secret}}
# Inicialização local do Nodemailer ao subir o servidor HTTP; desative para serviço externo.
app.recovery.mailer-auto-start=${MAILER_AUTO_START:false}
app.recovery.mailer-directory=${MAILER_DIRECTORY:mailer}
app.recovery.node-executable=${NODE_EXECUTABLE:node}
# Foto de perfil: o frontend envia a imagem já recortada, bem abaixo destes limites. A leitura
# preguiçosa faz o erro de arquivo grande chegar ao tratamento de erros do AvatarController.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.resolve-lazily=true

