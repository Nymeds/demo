spring.application.name=demo
spring.datasource.url=jdbc:h2:mem:academic-organizer-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=test-only-jwt-secret-with-more-than-32-bytes
app.jwt.access-token-expiration-ms=900000
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.resolve-lazily=true
app.legal.terms-version=2026-09-29
app.legal.privacy-version=2026-09-29
app.auth.cookie-secure=false
app.recovery.mailer-url=http://127.0.0.1:3001
app.recovery.mailer-secret=
app.recovery.hash-secret=test-only-recovery-hash-secret-with-32-bytes
app.recovery.mailer-auto-start=false
app.recovery.mailer-directory=../mailer
app.recovery.node-executable=node
